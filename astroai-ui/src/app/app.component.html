<header>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
		<a class="navbar-brand d-flex align-items-center" routerLink="/">
			<img src="assets/vedicastro-logo.png" alt="VedicAstro Logo" class="navbar-logo me-2">
			<span class="brand-text">VedicAstro</span>
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div id="mainNav" class="collapse navbar-collapse" >
			<ul class="navbar-nav ms-auto" (click)="closeNavbar()">
				<li class="nav-item"><a class="nav-link" routerLink="/">Home</a></li>
				<li class="nav-item"><a class="nav-link" routerLink="/daily-prediction">Daily Horoscope</a></li>
				<li class="nav-item"><a class="nav-link" routerLink="/daily-panchang">Panchang</a></li>
				<li class="nav-item"><a class="nav-link" routerLink="/city-panchang">City Panchang</a></li>

				<ng-container *ngIf="authService.isAuthenticated()">
					<li class="nav-item"><a class="nav-link" routerLink="/birth-chart">Vedic Astrology</a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/numerology">Numerology</a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/matchmaking">Matchmaking</a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/yearly-horoscope">Yearly Horoscope</a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/remedies">Remedies</a></li>
				</ng-container>
			</ul>
			<div class="d-flex align-items-center gap-2 ms-lg-3">
				<ng-container *ngIf="(authService.user$ | async) as user">
					<ng-container *ngIf="!user.is_anonymous">
						<div class="user-info d-flex align-items-center gap-2">
							<img
								[src]="authService.getUserAvatar() || 'assets/default-avatar.svg'"
								alt="User avatar"
								class="user-avatar"
								onerror="this.src='assets/default-avatar.svg'">
							<span class="text-white d-none d-md-inline">{{ authService.getUserName() || user.email }}</span>
						</div>
						<button class="btn btn-outline-light btn-sm" (click)="signOut()">
							Sign Out
						</button>
					</ng-container>
					<ng-container *ngIf="user.is_anonymous">
						<a class="btn btn-primary btn-sm" routerLink="/login">
							Sign In
						</a>
					</ng-container>
				</ng-container>
			</div>
		</div>
	</nav>
</header>

<main id="main-content">
	<router-outlet></router-outlet>
</main>
